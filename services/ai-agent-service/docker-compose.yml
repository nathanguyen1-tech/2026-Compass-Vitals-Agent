services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_agent_db
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d ai_agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-agent:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PYTHONIOENCODING=utf-8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "ai-agent:8001"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - ai-agent

volumes:
  postgres_data:
